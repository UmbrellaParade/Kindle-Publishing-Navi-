<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex,follow" />
    <meta http-equiv="refresh" content="2;url=https://umbrellaparade.github.io/Kindle-Publishing-Navi/" />
    <title>Kindle 出版ナビは新URLへ移動しました</title>
    <style>
      :root { color-scheme: dark; font-family: "Noto Sans JP", system-ui, sans-serif; }
      * { box-sizing: border-box; }
      body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 24px; background: #0d0d1a; color: #e8e8ff; }
      main { width: min(560px, 100%); padding: 32px; border: 1px solid #2a2a50; border-radius: 18px; text-align: center; background: #17172d; box-shadow: 0 20px 70px rgba(0,0,0,.35); }
      .icon { font-size: 44px; }
      h1 { margin: 14px 0 10px; font-size: clamp(20px, 5vw, 28px); color: #ff5c9a; }
      p { margin: 8px 0; color: #b8bad2; line-height: 1.8; }
      a { display: inline-block; margin-top: 18px; padding: 11px 20px; border: 1px solid #00f5ff88; border-radius: 10px; color: #00f5ff; text-decoration: none; font-weight: 700; background: #00f5ff12; }
      small { display: block; margin-top: 18px; color: #8587a3; line-height: 1.7; }
    </style>
  </head>
  <body>
    <main>
      <div class="icon" aria-hidden="true">🌂</div>
      <h1>Kindle 出版ナビは新しくなりました</h1>
      <p>最新版へ移動しています。</p>
      <p>同じブラウザに保存された旧版プロジェクトは、最新版から取り込めます。</p>
      <a id="latest-link" href="https://umbrellaparade.github.io/Kindle-Publishing-Navi/">最新版を開く</a>
      <small>自動で移動しない場合は「最新版を開く」を押してください。</small>
    </main>
    <script>
      window.setTimeout(function () {
        window.location.replace('https://umbrellaparade.github.io/Kindle-Publishing-Navi/');
      }, 500);
    </script>
  </body>
</html>
